name: Build book

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress deploys of the same workflow on the same branch.
concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: build_requirements.txt

      - name: Resolve scikit-image revision
        id: skimage
        run: |
          sha=$(git ls-remote https://github.com/scikit-image/scikit-image.git refs/heads/main | cut -f1)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # Keyed by upstream SHA so a requirements.txt change does not force a rebuild.
      - name: Cache scikit-image wheel
        id: skimage-wheel
        uses: actions/cache@v6
        with:
          path: .skimage-wheels
          key: skimage-wheel-${{ runner.os }}-cp312-${{ steps.skimage.outputs.sha }}

      - name: Build scikit-image wheel
        if: steps.skimage-wheel.outputs.cache-hit != 'true'
        run: |
          mkdir -p .skimage-wheels
          python -m pip install --upgrade pip
          python -m pip wheel --no-deps -w .skimage-wheels \
            "scikit-image @ git+https://github.com/scikit-image/scikit-image@${{ steps.skimage.outputs.sha }}"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .skimage-wheels/scikit_image-*.whl
          # Install the rest without the VCS line (would rebuild from source).
          grep -vE '^(#|$|scikit-image@git)' build_requirements.txt \
            | python -m pip install -r /dev/stdin

      - name: Build the book
        # -W turns Sphinx warnings into errors; the notebooks must also run.
        run: jupyter-book build . --warningiserror --keep-going

      - name: Upload the built HTML
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: book-html
          path: _build/html
          retention-days: 14

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _build/html

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
